name: autofix (temporary)

on:
  push:
    branches: [feat/toml-rules]

jobs:
  autofix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fetch
      - run: cargo fmt --all
      - run: git diff > autofix.patch; wc -l autofix.patch
      - uses: actions/upload-artifact@v4
        with:
          name: autofix
          path: autofix.patch
