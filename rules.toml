# ---------------------------------------------------------------------------
# Infrastructure and DevOps tooling.
#
#   files      -> exact file names (e.g. "Dockerfile")
#   dirs       -> the file sits somewhere under this directory path
#   extensions -> the file must also have one of these extensions
#
# A rule matches when the file is named in `files` or sits under one of
# `dirs` (or both lists are empty), and its extension is in `extensions`
# (when that list is given). For example, `extensions = ["tf"]` alone
# matches every Terraform file.
# ---------------------------------------------------------------------------

[[infra]]
name = "Docker"
files = ["Dockerfile"]

[[infra]]
name = "Docker Compose"
files = ["docker-compose.yml", "docker-compose.yaml", "compose.yml", "compose.yaml"]

[[infra]]
name = "Makefile"
files = ["Makefile"]

[[infra]]
name = "GitHub Actions"
dirs = [".github/workflows"]

[[infra]]
name = "Kubernetes"
dirs = ["k8s", "kubernetes"]
extensions = ["yaml", "yml"]

[[infra]]
name = "Helm"
files = ["Chart.yaml"]

[[infra]]
name = "Skaffold"
files = ["skaffold.yaml", "skaffold.yml"]

[[infra]]
name = "Serverless Framework"
files = ["serverless.yml", "serverless.yaml"]

[[infra]]
name = "AWS SAM"
files = ["samconfig.toml"]

[[infra]]
name = "Vercel"
files = ["vercel.json"]

[[infra]]
name = "Netlify"
files = ["netlify.toml"]

[[infra]]
name = "Cloudflare Workers"
files = ["wrangler.toml", "wrangler.json", "wrangler.jsonc"]

[[infra]]
name = "Fly.io"
files = ["fly.toml"]

[[infra]]
name = "Render"
files = ["render.yaml"]

[[infra]]
name = "Heroku"
files = ["Procfile"]
