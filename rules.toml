# ---------------------------------------------------------------------------
# Per-file imports, used by `codedna framework <name>`.
#
# A file matches when its extension is listed and one of the import
# substrings appears on a non-comment line. `framework` is lowercase.
# Single-quoted TOML strings are literal, which keeps quotes readable.
# ---------------------------------------------------------------------------

# JavaScript / TypeScript

[[file_pattern]]
framework = "react"
extensions = ["ts", "tsx", "js", "jsx", "mjs"]
imports = [
    "from 'react'", 'from "react"',
    "from 'react-dom'", 'from "react-dom"',
    "require('react')", 'require("react")',
]

[[file_pattern]]
framework = "next.js"
extensions = ["ts", "tsx", "js", "jsx"]
imports = [
    "from 'next'", 'from "next"',
    "from 'next/", 'from "next/',
    "require('next')", 'require("next")',
]

[[file_pattern]]
framework = "express"
extensions = ["ts", "js", "mjs"]
imports = ["from 'express'", 'from "express"', "require('express')", 'require("express")']

[[file_pattern]]
framework = "vite"
extensions = ["ts", "js", "mjs"]
imports = ["from 'vite'", 'from "vite"', "from 'vite/", 'from "vite/']

[[file_pattern]]
framework = "vue"
extensions = ["ts", "tsx", "js", "jsx", "vue"]
imports = ["from 'vue'", 'from "vue"', "require('vue')", 'require("vue")']

[[file_pattern]]
framework = "svelte"
extensions = ["ts", "js", "svelte"]
imports = ["from 'svelte'", 'from "svelte"', "from 'svelte/", 'from "svelte/']

[[file_pattern]]
framework = "nestjs"
extensions = ["ts", "js"]
imports = ["from '@nestjs/", 'from "@nestjs/']

[[file_pattern]]
framework = "fastify"
extensions = ["ts", "js", "mjs"]
imports = ["from 'fastify'", 'from "fastify"', "require('fastify')", 'require("fastify")']

[[file_pattern]]
framework = "koa"
extensions = ["ts", "js", "mjs"]
imports = ["from 'koa'", 'from "koa"', "require('koa')", 'require("koa")']

[[file_pattern]]
framework = "remix"
extensions = ["ts", "tsx", "js", "jsx"]
imports = ["from '@remix-run/", 'from "@remix-run/']

[[file_pattern]]
framework = "gatsby"
extensions = ["ts", "tsx", "js", "jsx"]
imports = ["from 'gatsby'", 'from "gatsby"']

[[file_pattern]]
framework = "nuxt"
extensions = ["ts", "js", "vue"]
imports = ["from 'nuxt'", 'from "nuxt"', "from '#app'", 'from "#app"']

[[file_pattern]]
framework = "astro"
extensions = ["ts", "js", "astro"]
imports = ["from 'astro'", 'from "astro"', "from 'astro/", 'from "astro/']

# Python

