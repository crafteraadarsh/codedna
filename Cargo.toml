[package]
name = "codedna"
version = "0.2.11"
edition = "2021"
description = "Rust-powered CLI for codebase intelligence: stack detection, architecture hints, LOC breakdown, repo maps, and dead-code heuristics."
license = "MIT"
repository = "https://github.com/crafteraadarsh/codedna"
homepage = "https://github.com/crafteraadarsh/codedna"
documentation = "https://github.com/crafteraadarsh/codedna#readme"
readme = "README.md"
keywords = ["codebase", "analysis", "cli", "architecture", "loc"]
categories = ["command-line-utilities", "development-tools"]
authors = ["CodeDna Contributors"]
exclude = [
    ".github/",
    "target/",
    "skill/",
    "skills/",
    "scripts/",
    "templates/",
    "AGENTS.md",
    "CLAUDE.md",
    "GEMINI.md",
    ".cursorrules",
    "install.sh",
    "install.ps1",
]

[[bin]]
name = "codedna"
path = "src/main.rs"

[dependencies]
aho-corasick = "1"
xxhash-rust = { version = "0.8", features = ["xxh3"] }
clap = { version = "4", features = ["derive"] }
ignore = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rayon = "1"
git2 = { version = "0.21", features = ["vendored-openssl"] }
tempfile = "3"
toml = "1.1"
yaml-rust2 = "0.13"
ureq = { version = "3", default-features = false, features = ["native-tls", "json"] }
schemars = "1"
oxc_allocator = "=0.154.0"
oxc_ast = "=0.154.0"
oxc_ast_visit = "=0.154.0"
oxc_parser = { version = "=0.155.0", default-features = false }
oxc_span = "=0.154.0"
oxc_semantic = "=0.154.0"
oxc_syntax = "=0.154.0"
