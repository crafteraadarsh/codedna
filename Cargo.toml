[package]
name = "codedna"
version = "0.2.3"
edition = "2021"
description = "Rust-powered CLI for codebase intelligence: stack detection, architecture hints, LOC breakdown, repo maps, and dead-code heuristics."
license = "MIT"
repository = "https://github.com/crafteraadarsh/codedna"
homepage = "https://github.com/crafteraadarsh/codedna"
documentation = "https://github.com/crafteraadarsh/codedna#readme"
readme = "README.md"
keywords = ["codebase", "analysis", "cli", "architecture", "loc"]
categories = ["command-line-utilities", "development-tools"]
authors = ["CodeDna Contributors"]
exclude = [
    ".github/",
    "target/",
    "skill/",
    "skills/",
    "scripts/",
    "templates/",
    "AGENTS.md",
    "CLAUDE.md",
    "GEMINI.md",
    ".cursorrules",
    "install.sh",
    "install.ps1",
]

[[bin]]
name = "codedna"
path = "src/main.rs"

[dependencies]
aho-corasick = "1"
clap = { version = "4", features = ["derive"] }
ignore = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rayon = "1"
git2 = { version = "0.21", features = ["vendored-openssl"] }
tempfile = "3"
toml = "1.1"
ureq = { version = "3", default-features = false, features = ["native-tls", "json"] }
schemars = "1"
