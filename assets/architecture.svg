<svg xmlns="http://www.w3.org/2000/svg" width="1152" height="330" viewBox="0 0 1152 330" role="img" aria-label="How CodeDna works: input, git handler, scanner, parallel analyzers, dead code, analysis result, outputs">
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#8b949e"/></marker></defs>
<style>
